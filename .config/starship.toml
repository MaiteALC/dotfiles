"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](sapphire)\
$os\
$directory\
[](bg:mantle fg:sapphire)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$lua\
$python\
$git_branch\
$git_status\
[](fg:mantle)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:sapphire fg:crust"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[directory]
style = "bg:sapphire fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"Projects" = "󰣞 "
".config" = "󱁿 "
"nvim" = " "
"hypr" = " "

[git_branch]
symbol = " "
style = "fg:text bg:mantle"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "fg:text bg:mantle"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = " "
style = "fg:green bg:mantle"
format = '[ $symbol($version) ]($style)'

[c]
symbol = " "
style = "fg:sapphire bg:mantle"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "fg:peach bg:mantle"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "fg:sky bg:mantle"
format = '[ $symbol($version) ]($style)'

[php]
symbol = " "
style = "fg:lavender bg:mantle"
format = '[ $symbol($version) ]($style)'

[java]
symbol = " "
style = "fg:peach bg:mantle"
format = '[[ $symbol($version) ]]($style)'

[kotlin]
symbol = " "
style = "fg:mauve bg:mantle"
format = '[ $symbol($version) ]($style)'

[haskell]
symbol = " "
style = "fg:mauve bg:mantle"
format = '[ $symbol($version) ]($style)'

[lua]
symbol = "󰢱 "
style = "fg:blue bg:mantle"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:yellow bg:mantle"
format = '[ $symbol($version)(\(#$virtualenv\)) ]($style)'

[docker_context]
symbol = " "
style = "fg: sapphire bg:mantle"
format = '[ $symbol($context) ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[  ](bold fg:green)'
error_symbol = '[  ](bold fg:red)'
vimcmd_symbol = '[  ](bold fg:green)'
vimcmd_replace_one_symbol = '[  ](bold fg:yellow)'
vimcmd_replace_symbol = '[  ](bold fg:yellow)'
vimcmd_visual_symbol = '[  ](bold fg:lavender)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "fg:text"
disabled = false
show_notifications = false
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
