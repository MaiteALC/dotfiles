general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.disp.dpms({ action = "enable" })'
}


# Reduce brightness (optional, but useful for laptops)
listener {
    timeout = 120 # 2 minutes
    on-timeout = brightnessctl -s set 4%
    on-resume = brightnessctl -r
}


# Turn off the screen (DPMS)
listener {
    timeout = 150 # 2.5 minutes
    on-timeout = hyprctl dispatch 'hl.disp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.disp.dpms({ action = "enable" })'
}


# Lock the screen
listener {
    timeout = 330 # 5.5 minutes
    on-timeout = loginctl lock-session
}


# Suspend (Sleep)
listener {
    timeout = 600 # 10 minutes
    on-timeout = systemctl suspend
}


# Hibernate the PC
listener {
    timeout = 2400 # 40 minutes
    on-timeout = systemctl hibernate
}
